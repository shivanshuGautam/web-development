    <div class="container border p-3 rounded  shadow ">
      <div class="first text-center">
        <span
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-cloud-drizzle-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M4.158 12.025a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m6 0a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m-3.5 1.5a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m6 0a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m.747-8.498a5.001 5.001 0 0 0-9.499-1.004A3.5 3.5 0 1 0 3.5 11H13a3 3 0 0 0 .405-5.973"
            /></svg></span
        >WeatherNow
      </div>
      <span
        class="d-flex justify-content-center align-items-center mt-2 text-center"
        >Real-time Weather for any city in the world</span
      >
      <div class="d-flex justify-content-center align-items-center mt-4 gap-3">
        <input
          type="text"
          id="cityName"
          placeholder="Enter city name....(e.g. Bhopal, Satna)"
          class="form-control w-25"
        />
        <button type="button" class="btn btn-outline-secondary" onclick="getWeather()">Search</button>
      </div>

      <div class="d-flex justify-content-center align-items-center m-5">
        <label>Temp : <span id="Temperature">30</span>ºC</label>
      </div>
    </div>
